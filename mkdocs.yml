site_name: Peritheos Documentation
site_description: Thermodynamic equations of state for solid materials
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://peritheos.readthedocs.io/en/latest/"]
repo_url: https://github.com/CPrescher/peritheos
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - EOS models: models.md
  - Equation reference: equation-reference.md
  - Thermoelastic properties: thermoelastic-properties.md
  - Fitting data: fitting.md
  - Aragonite fitting example: notebooks/aragonite-eos-fitting.ipynb
  - Calculation uncertainty: uncertainty.md
  - Pressure standards: pressure-standards.md
  - Dioptas integration: dioptas-integration.md
  - EOSMAT schema: eosmat-schema.md
  - Advanced DAC analysis: dac-thermal-pressure.md
  - Units and reference states: units.md
  - API reference: api.md
  - API stability: api-stability.md
  - Validation: validation.md
  - References: references.md
  - Project policies: project-policies.md
  - Development: development.md
markdown_extensions:
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
