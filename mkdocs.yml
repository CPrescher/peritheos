site_name: Peritheos Documentation
site_description: Thermodynamic equations of state for solid materials
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://peritheos.readthedocs.io/en/latest/"]
repo_url: https://github.com/CPrescher/peritheos
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - EOS models: models.md
  - Shock Hugoniots: hugoniots.md
  - Equation reference: equation-reference.md
  - Sokolova–Dorogokupets equation audit: sokolova-dorogokupets-equation-audit.md
  - Jacobsen et al. (2008) MgO EOS audit: mgo-jacobsen-2008.md
  - Thermoelastic properties: thermoelastic-properties.md
  - Fitting data: fitting.md
  - Tutorial notebooks:
      - Pressure calibration quickstart: notebooks/pressure-calibration-quickstart.ipynb
      - Normalize mixed pressure scales: notebooks/normalize-mixed-pressure-scales.ipynb
      - Compare room-temperature EOS: notebooks/compare-room-temperature-eos.ipynb
      - Birch-Murnaghan f-F diagnostic: notebooks/birch-murnaghan-f-f-diagnostic.ipynb
      - Compare gold pressure scales: notebooks/compare-gold-pressure-scales.ipynb
      - Thermal EOS state surfaces: notebooks/thermal-eos-state-surfaces.ipynb
      - Fit to prediction uncertainty: notebooks/fit-to-prediction-uncertainty.ipynb
      - Explore the material library: notebooks/exploring-material-library.ipynb
      - EOSMAT round-trip: notebooks/eosmat-roundtrip.ipynb
      - DAC temperature sensitivity: notebooks/dac-temperature-sensitivity.ipynb
      - Aragonite P-V-T fitting: notebooks/aragonite-eos-fitting.ipynb
  - Calculation uncertainty: uncertainty.md
  - Pressure standards: pressure-standards.md
  - Pressure-scale normalization: pressure-scale-normalization.md
  - Dioptas integration: dioptas-integration.md
  - EOSMAT schema: eosmat-schema.md
  - Advanced DAC analysis: dac-thermal-pressure.md
  - Units and reference states: units.md
  - API reference: api.md
  - Rust API guide: rust-api.md
  - API stability: api-stability.md
  - Error handling: error-handling.md
  - Validation: validation.md
  - Primary EOS refit validation: primary-eos-refits.md
  - Literature reproductions: literature-reproductions.md
  - Thompson 2017 epsilon-FeOOH EOS: epsilon-feooh-thompson-2017.md
  - Material EOS candidates: material-eos-candidates.md
  - LitCurate candidate workflow: litcurate-candidate-workflow.md
  - Adding materials and EOS models: adding-materials-and-eos.md
  - References: references.md
  - Project policies: project-policies.md
  - Contributor documentation:
      - Development: development.md
      - Rust migration contract: rust-migration.md
      - Rust migration completion plan: rust-completion-plan.md
      - SciRS2 feasibility audit: scirs2-feasibility.md
markdown_extensions:
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
