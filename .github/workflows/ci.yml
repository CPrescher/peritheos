name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Build documentation
        run: uv run --frozen --group docs mkdocs build --strict

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"

      - name: Run tests
        run: uv run --frozen pytest -q -W error

  cross-platform:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Run tests
        run: uv run --frozen pytest -q -W error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Enforce coverage floor
        run: uv run --frozen pytest -q -W error --cov --cov-report=term-missing

  minimum-dependencies:
    name: Minimum direct dependencies / Python 3.9
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.9"
          version: "0.12.1"

      - name: Create minimum-dependency environment
        shell: bash
        run: |
          uv venv --python 3.9 "${RUNNER_TEMP}/peritheos-minimum"
          uv pip install \
            --python "${RUNNER_TEMP}/peritheos-minimum/bin/python" \
            --resolution lowest-direct \
            --editable . \
            'pytest>=7.4.4'

      - name: Run tests against declared dependency floors
        run: |
          "${RUNNER_TEMP}/peritheos-minimum/bin/python" -m pytest -q -W error

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --frozen --group release twine check dist/*

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/peritheos-smoke"
          uv pip install --python "${RUNNER_TEMP}/peritheos-smoke/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/peritheos-smoke/bin/python" -c "import peritheos; print(peritheos.__version__)"
