name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full compatibility matrix (also required before release)"
        type: boolean
        default: false

# Keep small hosted runners from oversubscribing their CPUs during numerical tests.
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) && '["1.83.0", "stable"]' || '["stable"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Test workspace
        run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --all-features --locked

      - name: Test Rust documentation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: cargo +${{ matrix.toolchain }} test --workspace --doc --all-features --locked

      - name: Build warning-free Rust documentation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --workspace --all-features --no-deps --locked

      - name: Check formatting and Clippy
        if: matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify publishable Rust crate
        if: matrix.toolchain == 'stable' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full))
        run: scripts/verify-rust-packages.sh

  rust-coverage:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Rust library coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Cache Rust dependencies and coverage tool
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: llvm-cov-0.9.0

      - name: Install coverage tool
        run: cargo +stable install cargo-llvm-cov --version 0.9.0 --locked

      - name: Enforce native library coverage floor
        run: >-
          cargo +stable llvm-cov --workspace --exclude peritheos-python
          --all-features --fail-under-lines 85

  dependency-audit:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Rust dependency licenses and sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit licenses and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources
          arguments: --all-features

  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  typing:
    name: Python typing / minimum Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.9"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.9

      - name: Check Python typing
        run: uv run --frozen mypy

  docs:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.13

      - name: Build documentation
        run: uv run --frozen --group docs mkdocs build --strict

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full mode uses Python 3.13 coverage instead of a duplicate test job.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) && '["3.9", "3.10", "3.11", "3.12", "3.14"]' || '["3.13"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-${{ matrix.python-version }}

      - name: Run compatibility tests
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full)
        run: uv run --frozen pytest -c .github/pytest-compatibility.ini --rootdir=. -q -W error --durations=30

      - name: Run complete tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: uv run --frozen pytest tests -q -W error --durations=30

  cross-platform:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.13

      - name: Run tests
        run: uv run --frozen pytest tests -q -W error --durations=30

  wheel-smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Wheel smoke / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package job already builds and smoke-tests the Linux wheel.
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.13

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          test -n "${wheel}"
          cp scripts/smoke_test_wheel.py "${RUNNER_TEMP}/smoke_test_wheel.py"
          cd "${RUNNER_TEMP}"
          uv run --isolated --no-project \
            --python 3.13 \
            --with "${wheel}" \
            python smoke_test_wheel.py

  free-threaded:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Free-threaded Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and free-threaded Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14t"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.14t

      - name: Run tests without enabling the GIL for PDF font handling
        env:
          # The locked FontTools extension does not declare free-threaded safety.
          FONTTOOLS_WITH_CYTHON: "0"
        run: |
          uv sync --python 3.14t --frozen --no-binary-package fonttools
          uv run --python 3.14t --frozen --no-sync python -W error -c 'import sys; import fontTools.misc.bezierTools as bezier; from matplotlib.backends import backend_pdf; assert bezier.__file__.endswith(".py"), bezier.__file__; assert not sys._is_gil_enabled()'
          uv run --python 3.14t --frozen --no-sync pytest tests -q -W error --durations=30

  coverage:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Complete Python package coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.13

      - name: Enforce coverage floor, including EOS compatibility paths
        run: uv run --frozen pytest tests -q -W error --durations=30 --cov --cov-report=term-missing

  minimum-dependencies:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Minimum direct dependencies / ${{ matrix.os }} / Python 3.9
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.9"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.9

      - name: Create minimum-dependency environment
        shell: bash
        run: |
          uv venv --python 3.9 "${RUNNER_TEMP}/peritheos-minimum"
          uv pip install \
            --python "${RUNNER_TEMP}/peritheos-minimum/bin/python" \
            --resolution lowest-direct \
            --constraint .github/minimum-test-constraints.txt \
            --editable . \
            'pytest>=7.4.4' \
            'matplotlib>=3.7,<4' \
            'pyparsing>=2.3.1,<3.3' \
            'Pillow>=9.2,<13' \
            'jsonschema>=4.18,<5' \
            'matplotlib>=3.7,<4'

      - name: Record minimum-dependency versions and numerical backend
        run: |
          uv pip freeze --python "${RUNNER_TEMP}/peritheos-minimum/bin/python"
          "${RUNNER_TEMP}/peritheos-minimum/bin/python" - <<'PY'
          import numpy
          import scipy
          assert numpy.__version__ == "1.22.0", numpy.__version__
          assert scipy.__version__ == "1.9.3", scipy.__version__
          numpy.show_config()
          PY

      - name: Run tests against declared dependency floors
        run: |
          "${RUNNER_TEMP}/peritheos-minimum/bin/python" -m pytest tests -q -W error --durations=30

  package:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: python-3.13

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --frozen --group release twine check dist/*

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/peritheos-smoke"
          uv pip install --python "${RUNNER_TEMP}/peritheos-smoke/bin/python" dist/*.whl
          cp scripts/smoke_test_wheel.py "${RUNNER_TEMP}/smoke_test_wheel.py"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/peritheos-smoke/bin/python" smoke_test_wheel.py
