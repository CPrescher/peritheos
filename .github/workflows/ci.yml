name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.83.0", "stable"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Check workspace
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets --all-features --locked

      - name: Test workspace
        run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --all-features --locked

      - name: Test Rust documentation
        run: cargo +${{ matrix.toolchain }} test --workspace --doc --all-features --locked

      - name: Build warning-free Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --workspace --all-features --no-deps --locked

      - name: Check formatting and Clippy
        if: matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify publishable Rust crate
        if: matrix.toolchain == 'stable'
        run: scripts/verify-rust-packages.sh

  rust-coverage:
    name: Rust library coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.0 --locked

      - name: Enforce native library coverage floor
        run: >-
          cargo +stable llvm-cov --workspace --exclude peritheos-python
          --all-features --fail-under-lines 85

  dependency-audit:
    name: Rust dependency licenses and sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit licenses and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources
          arguments: --all-features

  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

  typing:
    name: Python typing / minimum Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.9"
          version: "0.12.1"

      - name: Check Python typing
        run: uv run --frozen mypy

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Build documentation
        run: uv run --frozen --group docs mkdocs build --strict

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"

      - name: Run tests
        run: uv run --frozen pytest -q -W error

  cross-platform:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Run tests
        run: uv run --frozen pytest -q -W error

  wheel-smoke:
    name: Wheel smoke / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          test -n "${wheel}"
          cd "${RUNNER_TEMP}"
          uv run --isolated --no-project \
            --python 3.13 \
            --with "${wheel}" \
            python -c \
            "from importlib import resources; from peritheos import Material, get_material_document, list_material_documents; from peritheos.eos.rt import BM3; assert resources.files('peritheos').joinpath('py.typed').is_file(); assert BM3(10, 120, 4).pressure(9) > 0; assert len(list_material_documents()) == 115; assert len(Material.from_eosmat(get_material_document('gold')).eos_records) == 4"

  free-threaded:
    name: Free-threaded Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and free-threaded Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14t"
          version: "0.12.1"

      - name: Run tests
        run: uv run --python 3.14t --frozen pytest -q -W error

  coverage:
    name: Complete Python package coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Enforce coverage floor, including EOS compatibility paths
        run: uv run --frozen pytest -q -W error --cov --cov-report=term-missing

  minimum-dependencies:
    name: Minimum direct dependencies / Python 3.9
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.9"
          version: "0.12.1"

      - name: Create minimum-dependency environment
        shell: bash
        run: |
          uv venv --python 3.9 "${RUNNER_TEMP}/peritheos-minimum"
          uv pip install \
            --python "${RUNNER_TEMP}/peritheos-minimum/bin/python" \
            --resolution lowest-direct \
            --editable . \
            'pytest>=7.4.4' \
            'jsonschema>=4.18,<5'

      - name: Run tests against declared dependency floors
        run: |
          "${RUNNER_TEMP}/peritheos-minimum/bin/python" -m pytest -q -W error

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.1"

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --frozen --group release twine check dist/*

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/peritheos-smoke"
          uv pip install --python "${RUNNER_TEMP}/peritheos-smoke/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/peritheos-smoke/bin/python" -c "from importlib import resources; from peritheos import Material, get_material_document, list_material_documents; assert resources.files('peritheos').joinpath('py.typed').is_file(); assert len(list_material_documents()) == 115; assert len(Material.from_eosmat(get_material_document('gold')).eos_records) == 4"
