[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peritheos"
dynamic = ["version"]
description = "A library for thermodynamic equations of state calculations"
readme = "README.md"
authors = [
    {name = "Clemens Prescher", email = "clemens.prescher@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["equation-of-state", "high-pressure", "thermodynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/cprescher/peritheos"
"Bug Tracker" = "https://github.com/cprescher/peritheos/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]
release = [
    "twine>=6.2.0,<7",
]

[tool.setuptools.dynamic]
version = {attr = "peritheos.__version__"}

[tool.ruff]
target-version = "py39"
line-length = 88
