[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peritheos"
dynamic = ["version"]
description = "A library for thermodynamic equations of state calculations"
readme = "README.md"
authors = [
    {name = "Clemens Prescher", email = "clemens.prescher@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["equation-of-state", "high-pressure", "thermodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/cprescher/peritheos"
"Documentation" = "https://peritheos.readthedocs.io/"
"Source" = "https://github.com/cprescher/peritheos"
"Bug Tracker" = "https://github.com/cprescher/peritheos/issues"
"Changelog" = "https://github.com/cprescher/peritheos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=6.0,<8",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs>=1.6,<2",
    "pymdown-extensions>=10,<11",
]
release = [
    "twine>=6.2.0,<7",
]

[tool.setuptools.dynamic]
version = {attr = "peritheos.__version__"}

[tool.setuptools.packages.find]
include = ["peritheos*"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["peritheos"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
