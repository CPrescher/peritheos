[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "peritheos"
dynamic = ["version"]
description = "A library for thermodynamic equations of state calculations"
readme = "README.md"
authors = [
    {name = "Clemens Prescher", email = "clemens.prescher@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["equation-of-state", "high-pressure", "thermodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.9.3",
]

[project.urls]
"Homepage" = "https://github.com/cprescher/peritheos"
"Documentation" = "https://peritheos.readthedocs.io/"
"Source" = "https://github.com/cprescher/peritheos"
"Bug Tracker" = "https://github.com/cprescher/peritheos/issues"
"Changelog" = "https://github.com/cprescher/peritheos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "jsonschema>=4.18,<5",
    "mypy>=1.16,<2",
    "pytest>=7.4.4",
    "pytest-cov>=6.0,<8",
    "ruff>=0.12,<1",
]
docs = [
    "matplotlib>=3.7,<4",
    "mkdocs>=1.6,<2",
    "mkdocs-jupyter>=0.25,<1",
    "mkdocs-material>=9,<10",
    "pymdown-extensions>=10,<11",
]
release = [
    "twine>=6.2.0,<7",
]

[tool.maturin]
manifest-path = "crates/peritheos-python/Cargo.toml"
module-name = "peritheos._rust"
python-source = "."
include = [
    {path = "peritheos/py.typed", format = ["sdist", "wheel"]},
    {path = "peritheos/data/**/*", format = ["sdist", "wheel"]},
    {path = "crates/peritheos-core/tests/data/**/*", format = "sdist"},
    {path = "docs/**/*", format = "sdist"},
    {path = "scripts/**/*", format = "sdist"},
    {path = "mkdocs.yml", format = "sdist"},
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["peritheos"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.9"
files = ["peritheos"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["attr-defined", "import-untyped", "misc", "override"]
