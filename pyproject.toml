[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peritheos"
version = "0.1.0"
description = "A library for thermodynamic equations of state calculations"
readme = "README.md"
authors = [
    {name = "TheosPy Team", email = "clemens.prescher@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/cprescher/peritheos"
"Bug Tracker" = "https://github.com/cprescher/peritheos/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]
