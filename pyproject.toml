[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "peritheos_build"
backend-path = ["."]

[project]
name = "peritheos"
dynamic = ["version"]
description = "A library for thermodynamic equations of state calculations"
readme = "README.md"
authors = [
    {name = "Clemens Prescher", email = "clemens.prescher@gmail.com"}
]
# The code is MIT; the distribution also contains separately attributed data.
# This reference describes that scope without inventing missing source grants.
license = "LicenseRef-Peritheos-Distribution"
license-files = [
    "LICENSE",
    "LICENSES/*.txt",
    "peritheos/data/LICENSING.md",
    "peritheos/data/datasets/*.LICENSE.md",
    "peritheos/data/datasets/ma_2024_sources/LICENSE.md",
    "peritheos/data/third_party/rust/**/*",
]
keywords = ["equation-of-state", "high-pressure", "thermodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.3",
]

[project.optional-dependencies]
data = ["peritheos-datasets==0.17.4"]

[tool.uv.sources]
peritheos-datasets = {path = "packages/peritheos-datasets"}

[project.urls]
"Homepage" = "https://github.com/cprescher/peritheos"
"Documentation" = "https://peritheos.readthedocs.io/"
"Source" = "https://github.com/cprescher/peritheos"
"Bug Tracker" = "https://github.com/cprescher/peritheos/issues"
"Changelog" = "https://github.com/cprescher/peritheos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "Pillow>=9.2,<13",
    "jsonschema>=4.18,<5",
    "matplotlib>=3.7,<4",
    "mypy>=1.16,<2",
    "pytest>=7.4.4",
    "pytest-cov>=6.0,<8",
    # The last Python 3.9 Matplotlib still uses pre-3.3 parser spellings.
    "pyparsing>=3.0.9,<3.3; python_version < '3.10'",
    "ruff>=0.12,<1",
]
docs = [
    "matplotlib>=3.7,<4",
    "mkdocs>=1.6,<2",
    "mkdocs-jupyter>=0.25,<1",
    "mkdocs-material>=9,<10",
    "pymdown-extensions>=10,<11",
    "pyparsing>=3.0.9,<3.3; python_version < '3.10'",
]
release = [
    "twine>=6.2.0,<7",
]

[tool.maturin]
manifest-path = "crates/peritheos-python/Cargo.toml"
module-name = "peritheos._rust"
python-source = "."
include = [
    {path = "peritheos/py.typed", format = ["sdist", "wheel"]},
    {path = "peritheos/data/**/*", format = ["sdist", "wheel"]},
    {path = "CHANGELOG.md", format = "sdist"},
    {path = "CITATION.cff", format = "sdist"},
    {path = "CODE_OF_CONDUCT.md", format = "sdist"},
    {path = "CONTRIBUTING.md", format = "sdist"},
    {path = "SECURITY.md", format = "sdist"},
    {path = "SUPPORT.md", format = "sdist"},
    {path = "crates/peritheos/tests/data/**/*", format = "sdist"},
    {path = "docs/**/*", format = "sdist"},
    {path = "scripts/**/*", format = "sdist"},
    {path = "mkdocs.yml", format = "sdist"},
    {path = "output/material-candidates/brown-nacl-1999/**/*", format = "sdist"},
    {path = "output/material-candidates/ferrous-ringwoodite/**/*", format = "sdist"},
    {path = "output/material-candidates/brucite/*.eosmat", format = "sdist"},
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    # Locally retrieved full texts and private correspondence are preserved in
    # the review archive, not distributed as library or research fixtures.
    "output/**/sources/**",
    "output/**/email-to-*",
    "output/**/zotero-*",
    "docs/data/fei-2007-gold-follow-up-sources/ye-2017-intercomparison.pdf",
    # Original Fei source artwork is private evidence, not a distribution input.
    "docs/data/fei-2007-thermal-source-figures/**",
    # Original source containers are retained privately; numerical CSVs remain.
    "peritheos/data/datasets/kcl_variant_sources/6779TableS1 revised.xlsx",
    "peritheos/data/datasets/chidester_2018_sources/AM-18-56212.zip",
    # The independently licensed Mendeley workbook remains distributed.
    # This publisher supplement is retained only as repository audit evidence.
    "peritheos/data/datasets/ma_2024_sources/supporting-information.docx",
    # Superseded thesis structure and original historical snapshot are private.
    "peritheos/data/datasets/brucite-he-2023-table43.cif",
    "output/material-candidates/brucite/brucite-before-disposition-2026-10-17.eosmat",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["peritheos"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.9"
files = ["peritheos"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["attr-defined", "import-untyped", "misc", "override"]
