[package]
name = "peritheos-python"
description = "Private PyO3 extension for the Peritheos Python package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
peritheos-core = { path = "../peritheos-core" }
peritheos-fit = { path = "../peritheos-fit" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }

[lints]
workspace = true
